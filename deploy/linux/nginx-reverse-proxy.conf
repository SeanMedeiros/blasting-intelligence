# Example: nginx terminates HTTPS and forwards to the application on 127.0.0.1:8000.
# server.env then contains:  BI_HOST=127.0.0.1  BI_PORT=8000  BI_TRUSTED_PROXIES=127.0.0.1
#                            BI_COOKIE_SECURE=1  BI_PUBLIC_URL=https://blasting.mine.local
server {
    listen 80;
    server_name blasting.mine.local;
    return 308 https://$host$request_uri;
}
server {
    listen 443 ssl;
    http2 on;
    server_name blasting.mine.local;
    ssl_certificate     /etc/ssl/blasting/server.crt;
    ssl_certificate_key /etc/ssl/blasting/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 210m;            # point clouds (200 MB limit) and evidence files
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;          # large imports and PDF reports
    }
}
