# Alembic configuration. The database URL comes from BI_DATABASE_URL (see app/config.py),
# so this file holds no credentials. Usual commands (from backend/):
#   python -m app.manage db-upgrade      apply pending migrations
#   python -m app.manage db-current      show the schema revision
#   alembic revision --autogenerate -m "describe change"   (developers)
[alembic]
prepend_sys_path = .
path_separator = os
script_location = %(here)s/migrations
file_template = %%(rev)s_%%(slug)s
