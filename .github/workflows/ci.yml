name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-sqlite:
    name: Backend tests · SQLite · Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r backend/requirements.txt
      - name: pytest
        working-directory: backend
        run: python -m pytest -q
      - name: i18n catalogue complete
        working-directory: backend
        run: |
          PYTHONPATH=. python tools/i18n_extract.py --missing | tee /tmp/i18n.txt
          grep -q ", 0 without French" /tmp/i18n.txt
          python tools/i18n_codes.py --check

  backend-postgres:
    name: Backend tests · PostgreSQL 16
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: bi
          POSTGRES_PASSWORD: bi-test-pass
          POSTGRES_DB: bi_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U bi" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      BI_TEST_DATABASE_URL: postgresql+psycopg://bi:bi-test-pass@127.0.0.1:5432/bi_test
      BI_TEST_PG_URL: postgresql+psycopg://bi:bi-test-pass@127.0.0.1:5432/bi_copy_test
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r backend/requirements.txt
      - name: second database for the copy test
        run: PGPASSWORD=bi-test-pass psql -h 127.0.0.1 -U bi -d bi_test -c "CREATE DATABASE bi_copy_test"
      - name: pytest
        working-directory: backend
        run: python -m pytest -q

  backend-windows:
    name: Backend tests · Windows
    runs-on: windows-latest
    # The target platform; kept informative until the first green run on a Windows runner (see docs/TESTING_REPORT.md).
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r backend/requirements.txt
      - name: pytest
        working-directory: backend
        run: python -m pytest -q
      - name: launcher settings check
        working-directory: backend
        run: python -m app.serve --check
      - name: PowerShell service script parses
        shell: pwsh
        run: |
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile("$PWD\deploy\windows\service.ps1", [ref]$null, [ref]$errors) | Out-Null
          if ($errors) { $errors | ForEach-Object { Write-Error $_.ToString() }; exit 1 }
          powershell -NoProfile -ExecutionPolicy Bypass -File deploy\windows\service.ps1 -Action status

  frontend:
    name: Frontend · type check and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit -p .
      - run: npm run build

  e2e:
    name: End-to-end (Playwright) · demo and production over HTTPS
    runs-on: ubuntu-latest
    needs: [backend-sqlite, frontend]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r backend/requirements.txt playwright && python -m playwright install --with-deps chromium
      - name: demonstration server (port 8001)
        working-directory: backend
        run: |
          BI_MODE=demo BI_DATA_DIR=$RUNNER_TEMP/demo BI_BACKUP_DAILY_AT= nohup python -m app.serve > $RUNNER_TEMP/demo.log 2>&1 &
          for i in $(seq 60); do curl -sf http://127.0.0.1:8001/api/health && break; sleep 2; done
      - name: production server over HTTPS (port 8443, internal CA)
        working-directory: backend
        run: |
          export BI_TLS_DIR=$RUNNER_TEMP/tls
          python -m app.manage make-cert --dns localhost --ip 127.0.0.1
          BI_MODE=production BI_DATA_DIR=$RUNNER_TEMP/prod BI_ADMIN_PASSWORD=First-start-2026 BI_BACKUP_DAILY_AT= \
          BI_PORT=8443 BI_TLS_CERT=$BI_TLS_DIR/server.crt BI_TLS_KEY=$BI_TLS_DIR/server.key \
            nohup python -m app.serve > $RUNNER_TEMP/prod.log 2>&1 &
          for i in $(seq 60); do curl -sf --cacert $BI_TLS_DIR/ca.crt https://localhost:8443/api/health && break; sleep 2; done
      - run: python e2e/smoke.py http://127.0.0.1:8001
      - run: python e2e/production_smoke.py https://localhost:8443
      - name: server logs
        if: failure()
        run: tail -n 100 $RUNNER_TEMP/demo.log $RUNNER_TEMP/prod.log
